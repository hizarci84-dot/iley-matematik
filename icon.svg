<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <stop offset="0%" stop-opacity="0.2"/>
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Math Graduation Cap & Compass Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Graduation Cap -->
    <path d="M 0 -100 L 160 -30 L 0 40 L -160 -30 Z" fill="url(#goldGrad)"/>
    <path d="M 0 40 L 110 -8 L 110 32 C 110 90, -110 90, -110 32 L -110 -8 Z" fill="#b45309"/>
    <!-- Tassel -->
    <path d="M 120 -12 C 140 10, 150 50, 150 90" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="150" cy="98" r="10" fill="#fef08a"/>
    
    <!-- Pi & Math Symbols Symbol -->
    <text x="0" y="160" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle" letter-spacing="2">İLEY 6</text>
  </g>

  <!-- Math Decorative Badges -->
  <circle cx="96" cy="96" r="28" fill="#ffffff" fill-opacity="0.12"/>
  <text x="96" y="106" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">∑</text>

  <circle cx="416" cy="96" r="28" fill="#ffffff" fill-opacity="0.12"/>
  <text x="416" y="106" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">√</text>

  <circle cx="96" cy="416" r="28" fill="#ffffff" fill-opacity="0.12"/>
  <text x="96" y="426" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">π</text>

  <circle cx="416" cy="416" r="28" fill="#ffffff" fill-opacity="0.12"/>
  <text x="416" y="426" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">%</text>
</svg>
